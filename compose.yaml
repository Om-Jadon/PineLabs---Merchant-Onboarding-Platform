name: merchant-onboarding

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-merchant-onboarding}-local:dev
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
  pids_limit: 128
  mem_limit: 1g
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://desk_workflow@db:5432/merchant
    DATABASE_LOGIN_FILE: /var/lib/workflow-login/login.key
    SIMULATOR_URL: http://simulator:8001
    CALLBACK_URL: http://api:8000
    KEY_DIRECTORY: /var/lib/merchant-webhooks
    SESSION_KEY_DIRECTORY: /var/lib/merchant-keys
    SIMULATOR_KEY_DIRECTORY: /var/lib/merchant-requests

services:
  db:
    image: ${COMPOSE_PROJECT_NAME:-merchant-onboarding}-postgres:17
    build:
      context: .
      target: database
    environment:
      POSTGRES_DB: merchant
      POSTGRES_USER: merchant
      # The image needs a bootstrap password. Administration uses the private Unix socket.
      POSTGRES_PASSWORD_FILE: /proc/sys/kernel/random/uuid
    command: ["postgres", "-c", "hba_file=/etc/postgresql/merchant_hba.conf"]
    volumes:
      - database:/var/lib/postgresql/data
      - db_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant -d merchant"]
      interval: 2s
      timeout: 4s
      retries: 30
  migrate:
    <<: *backend
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://merchant@/merchant?host=/var/run/postgresql
    volumes:
      - db_socket:/var/run/postgresql:ro
      - workflow_login:/var/lib/workflow-login
      - provider_login:/var/lib/provider-login
    command: ["sh", "-c", "alembic upgrade head && exec python -m desk.provision_db"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    pull_policy: never
    volumes:
      - keys:/var/lib/merchant-keys
      - request_keys:/var/lib/merchant-requests
      - webhook_keys:/var/lib/merchant-webhooks
      - workflow_login:/var/lib/workflow-login:ro
    command: ["uvicorn", "desk.api:app", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "24", "--no-access-log"]
    ports: ["127.0.0.1:${MERCHANT_PORT:-8018}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 30
  simulator:
    <<: *backend
    environment:
      <<: *backend-env
      KEYS_READ_ONLY: "1"
      DATABASE_URL: postgresql+psycopg://desk_provider@db:5432/merchant
      DATABASE_LOGIN_FILE: /var/lib/provider-login/login.key
    volumes:
      - request_keys:/var/lib/merchant-requests:ro
      - webhook_keys:/var/lib/merchant-webhooks:ro
      - provider_login:/var/lib/provider-login:ro
    pull_policy: never
    command: ["uvicorn", "desk.simulator:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 30
  worker:
    <<: *backend
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KEYS_READ_ONLY: "1"
    volumes:
      - request_keys:/var/lib/merchant-requests:ro
      - workflow_login:/var/lib/workflow-login:ro
    pull_policy: never
    command: ["python", "-m", "desk.worker"]
    depends_on:
      api: {condition: service_healthy}
      simulator: {condition: service_healthy}
volumes:
  database:
  keys:
  request_keys:
  webhook_keys:
  db_socket:
  workflow_login:
  provider_login:
